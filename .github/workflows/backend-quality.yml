name: Backend quality

on:
  push:
    paths:
      - 'backend/**'
      - 'compose.yml'
      - '.github/workflows/backend-quality.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'compose.yml'
      - '.github/workflows/backend-quality.yml'

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --dev --locked
      - run: uv run ruff check .
      - run: uv run pytest
