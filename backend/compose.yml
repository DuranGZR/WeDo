services:
  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    command: ["sh", "-c", "uv run --no-dev alembic upgrade head && uv run --no-dev uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./tests:/app/tests

  worker:
    build: .
    env_file: .env
    command: ["uv", "run", "--no-dev", "python", "-m", "app.worker"]
    depends_on:
      api:
        condition: service_started
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wedo
      POSTGRES_PASSWORD: wedo
      POSTGRES_DB: wedo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wedo -d wedo"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
