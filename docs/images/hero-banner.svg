<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="960" height="220" role="img" aria-label="WeDo — Save. Decide. Together.">
  <!-- Soft outer shadow + rounded warm cream card (100% flat fills for universal SVG rendering) -->
  <rect x="14" y="14" width="936" height="196" rx="22" fill="#E6E1D6" opacity="0.55" />
  <rect x="12" y="10" width="936" height="196" rx="22" fill="#F8F6F0" stroke="#E2DCD0" stroke-width="1.5" />

  <!-- Subtle architectural grid dots on bottom-right -->
  <g fill="#CEC6B6">
    <circle cx="848" cy="136" r="1.9" /><circle cx="866" cy="136" r="1.9" /><circle cx="884" cy="136" r="1.9" /><circle cx="902" cy="136" r="1.9" />
    <circle cx="848" cy="154" r="1.9" /><circle cx="866" cy="154" r="1.9" /><circle cx="884" cy="154" r="1.9" /><circle cx="902" cy="154" r="1.9" />
    <circle cx="848" cy="172" r="1.9" /><circle cx="866" cy="172" r="1.9" /><circle cx="884" cy="172" r="1.9" /><circle cx="902" cy="172" r="1.9" />
  </g>

  <!-- Top-right minimal stack caption -->
  <text x="908" y="46" text-anchor="end" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="1.4" fill="#75716A">
    IOS · ANDROID · EXPO · FASTAPI · POSTGRESQL
  </text>

  <!-- Left geometric WeDo emblem (dark squircle + paired shared capsules + sage-green decided badge) -->
  <g transform="translate(82, 54)">
    <!-- Soft vector shadow under emblem -->
    <rect x="6" y="12" width="96" height="96" rx="22" fill="#D5CFC3" />
    <!-- Primary dark squircle card -->
    <rect x="2" y="6" width="96" height="96" rx="22" fill="#090909" />
    <!-- Paired angled capsules echoing WeDo's brand mark -->
    <rect x="47.5" y="22" width="17" height="42" rx="8.5" fill="#CFCFCD" transform="rotate(-35 56 43)" />
    <rect x="33.5" y="40" width="17" height="42" rx="8.5" fill="#F8F6F0" transform="rotate(-35 42 61)" />
    <!-- Sage green decided/verified badge -->
    <circle cx="86" cy="88" r="15.5" fill="#5C8061" stroke="#F8F6F0" stroke-width="3.5" />
    <path d="M80.2 88.2L84.1 92.1L92.2 83.8" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Editorial Brand Wordmark -->
  <g transform="translate(216, 122)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="70" font-weight="800" letter-spacing="-2.4" fill="#090909">
      WeDo<tspan fill="#5C8061">.</tspan>
    </text>
    <text x="3" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" letter-spacing="3.4" fill="#6E6B64">
      SAVE. DECIDE. TOGETHER.
    </text>
  </g>
</svg>
