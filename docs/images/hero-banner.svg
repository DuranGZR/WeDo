<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 228" width="960" height="228" role="img" aria-label="WeDo — Save. Plan. Together.">
  <defs>
    <linearGradient id="bronzeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4BEA4" />
      <stop offset="55%" stop-color="#A98B6E" />
      <stop offset="100%" stop-color="#8C6E52" />
    </linearGradient>
    <radialGradient id="warmGlow" cx="88%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#D8C3AA" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#F6F4F0" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Soft outer shadow + Warm Alabaster canvas card -->
  <rect x="14" y="14" width="936" height="202" rx="24" fill="#E4DDD2" opacity="0.55" />
  <rect x="12" y="10" width="936" height="202" rx="24" fill="#F6F4F0" stroke="#E2DCD0" stroke-width="1.5" />
  <rect x="12" y="10" width="936" height="202" rx="24" fill="url(#warmGlow)" />

  <!-- Subtle architectural grid dots on bottom-right -->
  <g fill="#C8BCAB">
    <circle cx="848" cy="142" r="1.9" /><circle cx="866" cy="142" r="1.9" /><circle cx="884" cy="142" r="1.9" /><circle cx="902" cy="142" r="1.9" />
    <circle cx="848" cy="160" r="1.9" /><circle cx="866" cy="160" r="1.9" /><circle cx="884" cy="160" r="1.9" /><circle cx="902" cy="160" r="1.9" />
    <circle cx="848" cy="178" r="1.9" /><circle cx="866" cy="178" r="1.9" /><circle cx="884" cy="178" r="1.9" /><circle cx="902" cy="178" r="1.9" />
  </g>

  <!-- Top-right minimal stack caption -->
  <text x="908" y="46" text-anchor="end" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="1.4" fill="#74706A">
    IOS · ANDROID · EXPO SDK 58 · FASTAPI · POSTGRESQL 17
  </text>

  <!-- Left WeDo Warm Bronze squircle with Paired Bookmark Ribbons -->
  <g transform="translate(80, 56)">
    <rect x="6" y="10" width="102" height="102" rx="24" fill="#D5CFC3" opacity="0.65" />
    <rect x="2" y="4" width="102" height="102" rx="24" fill="url(#bronzeBg)" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1.5" />

    <!-- Back alabaster bookmark ribbon -->
    <path d="M48 25 H69 C74 25 77 28 77 33 V80 L61 69 L45 80 V28 C45 26 46 25 48 25 Z" fill="#F6F4F0" opacity="0.96" />
    <!-- Front deep-ink bookmark ribbon -->
    <path d="M35 32 H56 C61 32 64 35 64 40 V86 L49.5 75 L35 86 V40 C35 35 38 32 43 32 Z" fill="#111110" />
    <!-- Minimal editorial lines inside front ribbon -->
    <rect x="42.5" y="45" width="15" height="4.2" rx="2.1" fill="#F6F4F0" />
    <rect x="42.5" y="53" width="10" height="4.2" rx="2.1" fill="#D4BEA4" />
  </g>

  <!-- Editorial Brand Wordmark -->
  <g transform="translate(216, 126)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="70" font-weight="800" letter-spacing="-2.4" fill="#111110">
      WeDo<tspan fill="#9E7F60">.</tspan>
    </text>
    <text x="3" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" letter-spacing="3.2" fill="#74706A">
      SAVE TOGETHER. PLAN TOGETHER.
    </text>
  </g>
</svg>
