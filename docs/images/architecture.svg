  <line x1="656" y1="191" x2="670" y2="191" stroke="#475569" stroke-width="2" />
  <polygon points="676,191 668,186.5 668,195.5" fill="#475569" />

  <!-- Node 1.4: Metadata Fetcher -->
  <rect x="676" y="138" width="190" height="106" rx="12" fill="#FFFFFF" stroke="#D97706" stroke-width="1.6" />
  <text x="771" y="166" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#1D1D1F">Metadata Fetcher</text>
  <text x="771" y="189" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#4B5563">curl-cffi · DNS IP pin</text>
  <text x="771" y="213" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#B45309">oEmbed · OG · JSON-LD</text>

  <!-- Arrow 1.4 -> 1.5 -->
  <line x1="866" y1="191" x2="880" y2="191" stroke="#475569" stroke-width="2" />
  <polygon points="886,191 878,186.5 878,195.5" fill="#475569" />

  <!-- Node 1.5: Preview Cache + DB -->
  <rect x="886" y="138" width="190" height="106" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.6" />
  <text x="981" y="166" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#1D1D1F">Preview Cache + DB</text>
  <text x="981" y="189" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#4B5563">Pillow 600px JPEG cache</text>
  <text x="981" y="213" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#0F766E">PostgreSQL 17 · Alembic</text>

  <!-- ==================== LANE 2: COLLABORATE, LIFECYCLE & SAFETY ==================== -->
  <rect x="28" y="280" width="1064" height="176" rx="14" fill="#FDFCF9" stroke="#E6E1D6" stroke-width="1.2" />
  <rect x="46" y="294" width="376" height="24" rx="12" fill="#F3EFE6" />
  <text x="234" y="310" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#57534E">
