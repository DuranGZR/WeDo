<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" width="1120" height="620" role="img" aria-label="WeDo System Architecture">
  <!-- Outer Warm Canvas Frame -->
  <rect x="6" y="6" width="1108" height="608" rx="20" fill="#F8F6F0" stroke="#E2DCD0" stroke-width="1.5" />

  <!-- Header -->
  <text x="34" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1D1D1F">
    WeDo System Architecture
  </text>
  <text x="34" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#6E6B64">
    Native Share Extension · SQLite Offline Outbox · SSRF-Hardened Metadata &amp; Preview Cache · Durable Worker
  </text>
  <rect x="854" y="28" width="232" height="28" rx="14" fill="#EFECE4" stroke="#DFD9CB" />
  <text x="970" y="46" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#4A4842">
    CAPTURE + COLLABORATE
  </text>

  <!-- ==================== LANE 1: CAPTURE & ENRICH ==================== -->
  <rect x="28" y="88" width="1064" height="170" rx="14" fill="#FDFCF9" stroke="#E6E1D6" stroke-width="1.2" />
  <rect x="46" y="102" width="278" height="24" rx="12" fill="#E8F0E9" />
  <text x="185" y="118" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#3D5E42">
    1 · CAPTURE &amp; ENRICH (WRITE PATH)
  </text>

  <!-- Node 1.1: Native Share Sheet -->
  <rect x="46" y="138" width="190" height="106" rx="12" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.3" />
  <text x="141" y="166" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#1D1D1F">Native Share Sheet</text>
  <text x="141" y="189" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#4B5563">iOS Share Ext · Android</text>
  <text x="141" y="213" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="600" fill="#3D5E42">expo-share-intent</text>

  <!-- Arrow 1.1 -> 1.2 -->
  <line x1="236" y1="191" x2="250" y2="191" stroke="#5C8061" stroke-width="2" />
  <polygon points="256,191 248,186.5 248,195.5" fill="#5C8061" />

  <!-- Node 1.2: Expo App + Outbox -->
  <rect x="256" y="138" width="190" height="106" rx="12" fill="#FFFFFF" stroke="#9E7F60" stroke-width="1.6" />
  <text x="351" y="166" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#1D1D1F">Expo App + Outbox</text>
  <text x="351" y="189" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#4B5563">SDK 58 · RN 0.88 · TS 6</text>
  <text x="351" y="213" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.8" fill="#7A5E42">SQLite owner-scoped queue</text>

  <!-- Arrow 1.2 -> 1.3 -->
  <line x1="446" y1="191" x2="460" y2="191" stroke="#475569" stroke-width="2" />
  <polygon points="466,191 458,186.5 458,195.5" fill="#475569" />

  <!-- Node 1.3: FastAPI Modular Edge -->
  <rect x="466" y="138" width="190" height="106" rx="12" fill="#FFFFFF" stroke="#334155" stroke-width="1.6" />
  <text x="561" y="166" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#1D1D1F">FastAPI Modular Edge</text>
  <text x="561" y="189" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#4B5563">Auth · Rate Limit · Policy</text>
  <text x="561" y="213" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#334155">POST /api/v1/items</text>

