  </text>

  <!-- Node 2.1: Shared Spaces & Lists -->
  <rect x="46" y="330" width="238" height="106" rx="12" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.3" />
  <text x="165" y="358" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" font-weight="700" fill="#1D1D1F">Spaces, Plans &amp; Comments</text>
  <text x="165" y="381" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#4B5563">QR Invites · Plans · Calendar</text>
  <text x="165" y="405" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.2" fill="#475569">TanStack Query · Zustand</text>

  <!-- Arrow 2.1 -> 2.2 -->
  <line x1="284" y1="383" x2="304" y2="383" stroke="#9E7F60" stroke-width="2" />
  <polygon points="310,383 302,378.5 302,387.5" fill="#9E7F60" />

  <!-- Node 2.2: Signed Preview URLs -->
  <rect x="310" y="330" width="238" height="106" rx="12" fill="#FFFFFF" stroke="#9E7F60" stroke-width="1.6" />
  <text x="429" y="358" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" font-weight="700" fill="#1D1D1F">Signed Preview URLs</text>
  <text x="429" y="381" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#4B5563">5-min viewer-scoped JWT</text>
  <text x="429" y="405" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.2" font-weight="600" fill="#7A5E42">Zero expiring social 403s</text>

  <!-- Arrow 2.2 -> 2.3 -->
  <line x1="548" y1="383" x2="568" y2="383" stroke="#9E7F60" stroke-width="2" />
  <polygon points="574,383 566,378.5 566,387.5" fill="#9E7F60" />

  <!-- Node 2.3: Background Worker (60s) -->
  <rect x="574" y="330" width="238" height="106" rx="12" fill="#FFFFFF" stroke="#334155" stroke-width="1.6" />
  <text x="693" y="358" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" font-weight="700" fill="#1D1D1F">Background Worker (60s)</text>
  <text x="693" y="381" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#4B5563">Plan reminders · Apple S2S</text>
  <text x="693" y="405" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.2" fill="#475569">Expo Push notifications</text>

  <!-- Arrow 2.3 -> 2.4 -->
  <line x1="812" y1="383" x2="832" y2="383" stroke="#9E7F60" stroke-width="2" />
  <polygon points="838,383 830,378.5 830,387.5" fill="#9E7F60" />

  <!-- Node 2.4: iOS & Android Client (Hero Dark Card) -->
  <rect x="838" y="330" width="238" height="106" rx="12" fill="#111110" stroke="#111110" stroke-width="1.5" />
  <text x="957" y="358" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" font-weight="700" fill="#FFFFFF">iOS &amp; Android Client</text>
  <text x="957" y="381" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#D4BEA4">Warm Alabaster · Haptics</text>
  <text x="957" y="405" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#E5E7EB">EN &amp; TR (761 keys) · Safety</text>

  <!-- ==================== LANE 3: PLATFORM SAFEGUARDS ==================== -->
  <rect x="28" y="478" width="1064" height="116" rx="14" fill="#F2EFE7" stroke="#DFD9CB" stroke-width="1.2" />
  <text x="46" y="498" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700" fill="#57534E">
    PLATFORM SAFEGUARDS &amp; COMPLIANCE (SHARED ACROSS API + WORKER)
  </text>

  <!-- Card A: Identity & Session Lifecycle -->
  <rect x="46" y="508" width="328" height="72" rx="10" fill="#FFFFFF" stroke="#E2DCD0" stroke-width="1.2" />
  <text x="210" y="530" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="700" fill="#1D1D1F">Identity &amp; Session Lifecycle</text>
  <text x="210" y="549" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#4B5563">Argon2 · 15m JWT · 30d rotating refresh</text>
  <text x="210" y="567" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#3D5E42">Apple S2S (jti dedup) · Google · Resend</text>

  <!-- Card B: Network & Abuse Defenses -->
  <rect x="397" y="508" width="328" height="72" rx="10" fill="#FFFFFF" stroke="#E2DCD0" stroke-width="1.2" />
  <text x="561" y="530" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="700" fill="#1D1D1F">Network &amp; Abuse Defenses</text>
  <text x="561" y="549" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#4B5563">120/m API · 10/m Auth sliding window</text>
  <text x="561" y="567" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#B45309">SSRF IP pin · 5 hops · 2 MiB / 5s cap</text>

  <!-- Card C: User Safety & Legal -->
  <rect x="748" y="508" width="328" height="72" rx="10" fill="#FFFFFF" stroke="#E2DCD0" stroke-width="1.2" />
  <text x="912" y="530" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="700" fill="#1D1D1F">User Safety &amp; Legal</text>
  <text x="912" y="549" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#4B5563">Policy filter · Reports · User blocking</text>
  <text x="912" y="567" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#475569">/legal/* · In-app &amp; web deletion</text>
</svg>
